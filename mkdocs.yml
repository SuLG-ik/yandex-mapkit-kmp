site_name: Yandex MapKit KMP
site_url: https://ymk-kmp.sulgik.ru
site_author: Vladimir Nenashkin
site_description: >-
  Kotlin Multiplatform wrapper for official Yandex MapKit SDK for iOS and Android targets with additional Compose Multiplatform support

repo_name: SuLG-ik/yandex-mapkit-kmp
repo_url: https://github.com/SuLG-ik/yandex-mapkit-kmp
edit_uri: ""

copyright: Copyright &copy; 2025 Vladimir Nenashkin

theme:
  name: 'material'

  # Default values, taken from mkdocs_theme.yml
  language: en
  palette:
    scheme: slate
    primary: black
    accent: indigo
  font:
    text: Roboto
    code: Roboto Mono
  icon:
    logo: logo
  features:
    - content.code.copy
    - content.tabs.link
    - navigation.top
    - navigation.tracking
    - search.suggest
    - toc.follow

# Versions come from gradle.properties and gradle/libs.versions.toml
hooks:
  - docs_hooks/versions.py

watch:
  - gradle.properties
  - gradle/libs.versions.toml

exclude_docs: |
  requirements.txt

# Plugins
plugins:
  - i18n:
      docs_structure: suffix
      languages:
        - locale: en
          name: English
          default: true
          build: true
        - locale: ru
          name: Русский
          build: true
          nav_translations:
            Getting started: Начало работы
            Overview: Обзор
            Installation: Установка
            Quick start: Быстрый старт
            Migration from MapKit: Миграция с MapKit
            Contributing: Разработка
            Licence: Лицензия
            Wrapper: Обёртка
            What is wrapped: Что обёрнуто
            Map and camera: Карта и камера
            Map objects: Объекты карты
            Base map objects: Объекты базовой карты
            Geolocation: Геолокация
            Layers and tiles: Слои и тайлы
            Offline maps and storage: Офлайн-карты и хранилище
            Runtime: Runtime
            Image resources: Изображения
            Compose support: Поддержка Compose
            Sample: Пример приложения
            API docs: Справочник API
  - search:
      lang:
        - en
        - ru

# Page tree
nav:
  - Getting started:
      - Overview: index.md
      - Installation: getting-started/installation.md
      - Quick start: getting-started/quick-start.md
      - Migration from MapKit: getting-started/migration.md
      - Contributing: getting-started/contributing.md
      - Licence: getting-started/licence.md
  - Wrapper:
      - Overview: wrapper/overview.md
      - What is wrapped: wrapper/coverage.md
      - Map and camera: wrapper/map.md
      - Map objects: wrapper/mapobjects.md
      - Base map objects: wrapper/geoobjects.md
      - Geolocation: wrapper/location.md
      - Layers and tiles: wrapper/layers.md
      - Offline maps and storage: wrapper/offline.md
      - Runtime: wrapper/runtime.md
      - Image resources: wrapper/image-resources.md
  - Compose support:
      - Overview: compose/overview.md
      - Map objects: compose/mapobjects.md
      - Image resources: compose/image-resources.md
  - Sample: sample.md
  - API docs: kdoc/index.html

# Extensions
markdown_extensions:
  - admonition
  - abbr
  - attr_list
  - def_list
  - footnotes
  - meta
  - md_in_html
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify {kwds: {case: lower}}
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.critic
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink:
      repo_url_shorthand: true
      user: SuLG-ik
      repo: yandex-mapkit-kmp
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde
