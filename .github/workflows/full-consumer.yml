name: MapKit Full consumer

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/full-consumer.yml'
      - 'build.gradle.kts'
      - 'gradle/libs.versions.toml'
      - 'verification/lite-consumer/**'
      - 'yandex-mapkit-kmp*/build.gradle.kts'
      - 'yandex-mapkit-kmp/api/full/**'
      - 'yandex-mapkit-kmp/src/full*/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '21'

jobs:
  android:
    name: Full consumer (Android)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Test the Full Android search adapter
        run: >-
          ./gradlew -PmapkitEdition=full -PskipIosTarget=true
          :yandex-mapkit-kmp:testAndroidHostTest
          --tests ru.sulgik.mapkit.search.SearchAdapterTest

      - name: Check the Full Android API
        run: ./gradlew -PmapkitEdition=full -PskipIosTarget=true :yandex-mapkit-kmp:checkAndroidAbi

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Launch Full consumer
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: aosp_atd
          script: bash verification/lite-consumer/run.sh android emulator-5554 with-integrations full

      - name: Upload consumer diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: full-consumer-android
          path: build/full-consumer/android/
          if-no-files-found: ignore

  ios:
    name: Full consumer (iOS)
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: ${{ env.JAVA_VERSION }}

      - name: Cache Kotlin/Native compiler
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-

      - name: Cache Full CocoaPods SDK
        uses: actions/cache@v6
        with:
          path: |
            ~/Library/Caches/CocoaPods
            ~/.cocoapods/repos
          key: cocoapods-full-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Check the Full Kotlin API
        run: ./gradlew -PmapkitEdition=full :yandex-mapkit-kmp:checkKotlinAbi

      - name: Test the Full iOS search adapter
        run: ./gradlew -PmapkitEdition=full :yandex-mapkit-kmp:iosSimulatorArm64Test

      - name: Launch Full consumer
        run: |
          simulator=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys

          runtimes = json.load(sys.stdin)["devices"]
          iphones = [
              device
              for runtime, devices in runtimes.items()
              if ".SimRuntime.iOS-" in runtime
              for device in devices
              if device["name"].startswith("iPhone")
          ]
          if not iphones:
              sys.exit("No iPhone simulator is available")
          device = next((device for device in iphones if device["state"] == "Booted"), iphones[-1])
          print(device["udid"])
          ')
          xcrun simctl bootstatus "$simulator" -b
          bash verification/lite-consumer/run.sh ios "$simulator" with-integrations full

      - name: Upload consumer diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: full-consumer-ios
          path: build/full-consumer/ios/
          if-no-files-found: ignore
