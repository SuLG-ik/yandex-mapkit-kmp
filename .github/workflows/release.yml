name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 0.5.0 or 1.0.0-beta01. Must match library_version in gradle.properties'
        required: true
        type: string
      dry_run:
        description: 'Verify and sign a release bundle with an ephemeral key without uploading it'
        required: false
        default: false
        type: boolean
      deployment_id:
        description: 'Resume the existing Central deployment for this version and release commit'
        required: false
        type: string

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  JAVA_VERSION: '21'

jobs:
  verify:
    name: Verify ${{ inputs.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify version
        env:
          VERSION: ${{ inputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
          DEPLOYMENT_ID: ${{ inputs.deployment_id }}
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$VERSION' is not a X.Y.Z or X.Y.Z-prerelease version"
            exit 1
          fi
          declared=$(grep '^library_version=' gradle.properties | cut -d '=' -f 2)
          if [ "$declared" != "$VERSION" ]; then
            echo "::error::library_version in gradle.properties is '$declared', expected '$VERSION'"
            exit 1
          fi
          if [[ -n "$DEPLOYMENT_ID" ]] && {
            [[ "$DRY_RUN" == true ]] ||
            [[ ! "$DEPLOYMENT_ID" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]];
          }; then
            echo "::error::deployment_id must be a UUID and is only supported for live release recovery"
            exit 1
          fi
          for tag in "v$VERSION" "$VERSION"; do
            tag_ref="refs/tags/$tag"
            if ! git show-ref --verify --quiet "$tag_ref"; then
              continue
            fi
            if [[ "$tag" == "v$VERSION" && -n "$DEPLOYMENT_ID" ]] &&
              tag_commit=$(git rev-parse -q --verify "$tag_ref^{commit}") &&
              [[ "$tag_commit" == "$GITHUB_SHA" ]]; then
              continue
            fi
            echo "::error::tag $tag already exists"
            exit 1
          done
          if ! grep -q "^## \[$VERSION\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section for $VERSION"
            exit 1
          fi

  test-android-device:
    name: Tests (Android emulator)
    needs: verify
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: aosp_atd
          disable-animations: false
          script: bash .github/scripts/test-android-device.sh release

      - name: Upload Android consumer and test diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: release-android-diagnostics
          path: |
            ${{ runner.temp }}/android-emulator-logcat.txt
            build/lite-consumer/android/
            build/full-consumer/android/
            **/build/reports/androidTests/**
          if-no-files-found: ignore

  release:
    name: Stage and publish ${{ inputs.version }}
    needs: [verify, test-android-device]
    permissions:
      contents: read
    runs-on: macos-26
    timeout-minutes: 150
    steps:
      - name: Require deployment recovery on live reruns
        if: ${{ !inputs.dry_run && inputs.deployment_id == '' && github.run_attempt != '1' }}
        run: |
          echo "::error::Check Central Portal before retrying and start a new run with deployment_id to resume an existing deployment."
          exit 1

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Cache Kotlin/Native compiler
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-

      - name: Cache CocoaPods
        uses: actions/cache@v6
        with:
          path: |
            ~/Library/Caches/CocoaPods
            ~/.cocoapods/repos
          key: cocoapods-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: cocoapods-${{ runner.os }}-

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Check formatting
        run: ./gradlew spotlessCheck

      - name: Build, test and check public API
        run: ./gradlew libraryCompileIosArm64 libraryTests libraryApiCheck

      - name: Boot an iPhone for staged consumer verification
        id: simulator
        run: python3 .github/scripts/select-ios-runtime.py current build/device-matrix/ios

      - name: Verify Lite and Full iOS consumers from staged artifacts
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          bash verification/lite-consumer/run.sh ios "$SIMULATOR_UDID"
          bash verification/lite-consumer/run.sh ios "$SIMULATOR_UDID" with-integrations full

      - name: Upload iOS consumer diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: release-ios-consumer-diagnostics
          path: |
            build/device-matrix/ios/
            build/lite-consumer/ios/
            build/full-consumer/ios/
          if-no-files-found: ignore

      - name: Rehearse the signed Lite and Full bundle
        if: ${{ inputs.dry_run }}
        env:
          VERSION: ${{ inputs.version }}
        run: bash .github/scripts/stage-central-bundle.sh "$VERSION" rehearsal

      - name: Sign the Lite and Full bundle
        if: ${{ !inputs.dry_run && inputs.deployment_id == '' }}
        env:
          VERSION: ${{ inputs.version }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
        run: bash .github/scripts/stage-central-bundle.sh "$VERSION" release

      - name: Publish and verify both editions on Maven Central
        if: ${{ !inputs.dry_run }}
        env:
          VERSION: ${{ inputs.version }}
          DEPLOYMENT_ID: ${{ inputs.deployment_id }}
          CENTRAL_USERNAME: ${{ secrets.SONATYPEUSERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.SONATYPEPASSWORD }}
        run: |
          python3 .github/scripts/central-bundle.py publish "$VERSION" "$GITHUB_SHA" \
            build/central-release/central-bundle.zip --resume "$DEPLOYMENT_ID"

  finalize:
    name: Tag and create GitHub release
    needs: release
    if: ${{ !inputs.dry_run }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Extract release notes
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          awk -v version="$VERSION" '
            $0 ~ "^## \\[" version "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          cat release-notes.md

      - name: Tag the published commit
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if git show-ref --verify --quiet "refs/tags/$VERSION"; then
            echo "::error::tag $VERSION already exists"
            exit 1
          fi
          tag_ref="refs/tags/v$VERSION"
          if git show-ref --verify --quiet "$tag_ref"; then
            tag_commit=$(git rev-parse --verify "$tag_ref^{commit}")
            test "$tag_commit" = "$GITHUB_SHA"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "v$VERSION" -m "Release $VERSION"
          git push origin "refs/tags/v$VERSION"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ inputs.version }}
          name: ${{ inputs.version }}
          body_path: release-notes.md
          prerelease: ${{ contains(inputs.version, '-') }}

  docs:
    name: Documentation
    needs: finalize
    if: ${{ !inputs.dry_run }}
    permissions:
      contents: write
    uses: ./.github/workflows/docs.yml
